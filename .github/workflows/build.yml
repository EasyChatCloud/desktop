name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Build Windows
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            npx electron-builder --win --x64
          } else {
            npx electron-builder --win --x64 --publish never
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: 易聊通-win-x64
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci

      # Import Developer ID Application certificate
      - name: Import Developer ID Application cert
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > dev-id-app.p12
          security create-keychain -p tmp1234 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmp1234 build.keychain
          security import dev-id-app.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k tmp1234 build.keychain
          rm dev-id-app.p12

      # Build & sign (tags: sign + notarize, PRs: unsigned)
      - name: Build macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$CSC_IDENTITY_AUTO_DISCOVERY" = "true" ]; then
            npx electron-builder --mac --universal
          else
            npx electron-builder --mac --universal --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 易聊通-mac
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
