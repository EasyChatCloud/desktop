<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #282c34;
    color: #ccc;
    overflow: hidden;
    user-select: none;
  }

  #tab-bar {
    display: flex;
    align-items: center;
    height: 38px;
    background: #282c34;
    border-bottom: 1px solid #3a3f4b;
    -webkit-app-region: drag;
    padding: 0 4px;
  }

  #tabs {
    display: flex;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100%;
    align-items: flex-end;
    gap: 1px;
  }
  #tabs::-webkit-scrollbar { height: 0; }

  .tab {
    display: flex;
    align-items: center;
    padding: 0 10px;
    height: 32px;
    min-width: 60px;
    max-width: 160px;
    background: #21252b;
    color: #aaa;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
    transition: background 0.15s;
  }
  .tab:hover { background: #2c313a; }
  .tab.active { background: #fff; color: #282c34; }

  .tab .title {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-align: center;
  }

  .tab .close {
    margin-left: 6px;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    border-radius: 50%;
    font-size: 11px;
    color: transparent;
    flex-shrink: 0;
  }
  .tab:hover .close { color: #888; }
  .tab .close:hover { background: #666; color: #fff; }

</style>
</head>
<body>
  <div id="tab-bar">
    <div id="tabs"></div>
  </div>

  <script>
    const tabsEl = document.getElementById('tabs')
    let tabs = []
    let activeId = null

    function render() {
      tabsEl.innerHTML = ''
      tabs.forEach(t => {
        const el = document.createElement('div')
        el.className = 'tab' + (t.id === activeId ? ' active' : '')
        el.title = t.title || t.id
        el.onclick = () => window.shellAPI.switchTab(t.id)
        el.onauxclick = (e) => { if (e.button === 1) window.shellAPI.closeTab(t.id) }

        const title = document.createElement('span')
        title.className = 'title'
        title.textContent = t.title || t.id
        el.appendChild(title)

        // Only session tabs get a close button
        if (t.id !== '__home__') {
          const close = document.createElement('span')
          close.className = 'close'
          close.textContent = '×'
          close.onclick = (e) => { e.stopPropagation(); window.shellAPI.closeTab(t.id) }
          el.appendChild(close)
        }

        tabsEl.appendChild(el)
      })
    }

    window.shellAPI.onTabsUpdate((data) => {
      tabs = data.tabs
      activeId = data.activeId
      render()
    })
  </script>
</body>
</html>
